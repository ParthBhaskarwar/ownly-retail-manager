<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ownly Retail Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-brand {
      font-family: 'Newsreader', serif;
    }
  </style>
</head>
<body class="bg-[#faf8f5] text-stone-800 min-h-screen flex flex-col items-center justify-center p-6 antialiased selection:bg-teal-100 selection:text-teal-900">

  <!-- Centered Card Container -->
  <div class="w-full max-w-[440px] bg-white border border-stone-200/90 rounded-2xl shadow-sm shadow-stone-200/50 p-8 sm:p-10 transition-all">
    
    <!-- Branding Header -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 rounded-xl bg-teal-800 text-white flex items-center justify-center font-brand font-semibold text-2xl shadow-inner shadow-teal-950/20">
          O
        </div>
        <div class="text-left">
          <span class="font-brand text-2xl font-bold tracking-tight text-stone-900 block leading-none">Ownly</span>
          <span class="text-[11px] font-medium tracking-wider uppercase text-stone-500 block mt-0.5">Retail Manager</span>
        </div>
      </div>
      <h1 class="font-brand text-2xl sm:text-[26px] font-semibold text-stone-900 mt-4 tracking-tight">Welcome back</h1>
      <p class="text-xs sm:text-sm text-stone-500 mt-1">Sign in to manage your store</p>
    </div>

    <!-- Error Alert Box -->
    <div class="mb-6 p-3.5 bg-rose-50/80 border border-rose-200 rounded-xl flex items-start gap-3 text-rose-800 text-xs sm:text-sm animate-fade-in" role="alert">
      <svg class="w-4 h-4 text-rose-600 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <div class="flex-1 font-medium">Incorrect email or password. Please verify and try again.</div>
    </div>

    <!-- Sign In Form -->
    <form class="space-y-4" onsubmit="event.preventDefault();">
      <!-- Email Address -->
      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1.5">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          value="bhaskarwarparth@gmail.com" 
          placeholder="name@store.com" 
          class="w-full px-3.5 py-2.5 bg-stone-50/50 border border-rose-300 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-rose-500 focus:bg-white transition-all placeholder:text-stone-400"
          required
        >
      </div>

      <!-- Password -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-stone-600">Password</label>
          <a href="#" class="text-xs font-medium text-teal-800 hover:text-teal-900 hover:underline">Forgot password?</a>
        </div>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            value="••••••••••••" 
            placeholder="Enter your password" 
            class="w-full px-3.5 py-2.5 pr-10 bg-stone-50/50 border border-rose-300 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-rose-500 focus:bg-white transition-all placeholder:text-stone-400 font-mono"
            required
          >
          <button 
            type="button" 
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-stone-400 hover:text-stone-600 transition-colors"
            aria-label="Toggle password visibility"
            onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';"
          >
            <!-- Eye icon -->
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Action -->
      <div class="pt-2">
        <button 
          type="submit" 
          class="w-full py-2.5 px-4 bg-teal-800 hover:bg-teal-900 text-white font-medium text-sm rounded-xl shadow-sm shadow-teal-950/20 hover:shadow-md transition-all duration-150 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-teal-700 focus:ring-offset-2"
        >
          <span>Sign In</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </div>
    </form>

    <!-- Footer Links -->
    <div class="mt-8 pt-6 border-t border-stone-100 text-center">
      <p class="text-xs sm:text-sm text-stone-500">
        New here? 
        <a href="#" class="font-semibold text-teal-800 hover:text-teal-900 hover:underline ml-1">Create an account</a>
      </p>
    </div>

  </div>

  <!-- Micro Footer / Security Badge -->
  <div class="mt-8 flex items-center gap-2 text-stone-400 text-xs">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
    </svg>
    <span>End-to-end encrypted retail cloud</span>
  </div>

</body>
</html>
