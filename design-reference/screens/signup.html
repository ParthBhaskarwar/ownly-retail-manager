<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - Ownly Retail Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-brand {
      font-family: 'Newsreader', serif;
    }
  </style>
</head>
<body class="bg-[#faf8f5] text-stone-800 min-h-screen flex flex-col items-center justify-center p-6 antialiased selection:bg-teal-100 selection:text-teal-900">

  <!-- Centered Card Container (Identical size and styling) -->
  <div class="w-full max-w-[440px] bg-white border border-stone-200/90 rounded-2xl shadow-sm shadow-stone-200/50 p-8 sm:p-10 transition-all">
    
    <!-- Branding Header -->
    <div class="flex flex-col items-center text-center mb-6">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 rounded-xl bg-teal-800 text-white flex items-center justify-center font-brand font-semibold text-2xl shadow-inner shadow-teal-950/20">
          O
        </div>
        <div class="text-left">
          <span class="font-brand text-2xl font-bold tracking-tight text-stone-900 block leading-none">Ownly</span>
          <span class="text-[11px] font-medium tracking-wider uppercase text-stone-500 block mt-0.5">Retail Manager</span>
        </div>
      </div>
      <h1 class="font-brand text-2xl sm:text-[26px] font-semibold text-stone-900 mt-3 tracking-tight">Create your account</h1>
      <p class="text-xs sm:text-sm text-stone-500 mt-1">Get started with your boutique store management</p>
    </div>

    <!-- Registration Form with Inline Validation -->
    <form class="space-y-3.5" onsubmit="event.preventDefault();">
      
      <!-- Full Name -->
      <div>
        <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">Full Name</label>
        <div class="relative">
          <input 
            type="text" 
            id="name" 
            name="name" 
            value="Parth Bhaskarwar" 
            placeholder="e.g. Rajesh Verma" 
            class="w-full px-3.5 py-2.5 bg-stone-50/50 border border-emerald-500/80 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 focus:bg-white transition-all placeholder:text-stone-400"
            required
          >
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-emerald-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Email Address -->
      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">Email Address</label>
        <div class="relative">
          <input 
            type="email" 
            id="email" 
            name="email" 
            value="bhaskarwarparth@gmail.com" 
            placeholder="name@store.com" 
            class="w-full px-3.5 py-2.5 bg-stone-50/50 border border-emerald-500/80 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 focus:bg-white transition-all placeholder:text-stone-400"
            required
          >
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-emerald-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Phone Number -->
      <div>
        <label for="phone" class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">Phone Number</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-xs font-medium text-stone-400 pointer-events-none">+91</span>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            value="98765 43210" 
            placeholder="98765 43210" 
            class="w-full pl-11 pr-3.5 py-2.5 bg-stone-50/50 border border-emerald-500/80 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 focus:bg-white transition-all placeholder:text-stone-400"
            required
          >
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-emerald-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            value="SecurePass123" 
            placeholder="Min. 8 characters" 
            class="w-full px-3.5 py-2.5 pr-10 bg-stone-50/50 border border-emerald-500/80 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 focus:bg-white transition-all font-mono"
            required
          >
          <button 
            type="button" 
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-stone-400 hover:text-stone-600 transition-colors"
            onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <!-- Password Strength Meter -->
        <div class="mt-1.5 flex items-center gap-1.5">
          <div class="h-1 flex-1 rounded-full bg-emerald-500"></div>
          <div class="h-1 flex-1 rounded-full bg-emerald-500"></div>
          <div class="h-1 flex-1 rounded-full bg-emerald-500"></div>
          <div class="h-1 flex-1 rounded-full bg-stone-200"></div>
          <span class="text-[11px] font-medium text-emerald-700 pl-1">Strong</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirm_password" class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">Confirm Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            value="SecurePass123" 
            placeholder="Repeat your password" 
            class="w-full px-3.5 py-2.5 pr-10 bg-stone-50/50 border border-emerald-500/80 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 focus:bg-white transition-all font-mono"
            required
          >
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-emerald-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
        </div>
        <p class="text-[11px] text-emerald-700 mt-1 font-medium flex items-center gap-1">
          <span>Passwords match</span>
        </p>
      </div>

      <!-- Submit Action -->
      <div class="pt-3">
        <button 
          type="submit" 
          class="w-full py-2.5 px-4 bg-teal-800 hover:bg-teal-900 text-white font-medium text-sm rounded-xl shadow-sm shadow-teal-950/20 hover:shadow-md transition-all duration-150 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-teal-700 focus:ring-offset-2"
        >
          <span>Create Account</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </div>
    </form>

    <!-- Footer Links -->
    <div class="mt-6 pt-5 border-t border-stone-100 text-center">
      <p class="text-xs sm:text-sm text-stone-500">
        Already have an account? 
        <a href="#" class="font-semibold text-teal-800 hover:text-teal-900 hover:underline ml-1">Sign in</a>
      </p>
    </div>

  </div>

  <!-- Micro Footer / Security Badge -->
  <div class="mt-6 flex items-center gap-2 text-stone-400 text-xs">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
    </svg>
    <span>Compliant with Indian GST & data safety norms</span>
  </div>

</body>
</html>
