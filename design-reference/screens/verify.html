<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify - Ownly Retail Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-brand {
      font-family: 'Newsreader', serif;
    }
  </style>
</head>
<body class="bg-[#faf8f5] text-stone-800 min-h-screen flex flex-col items-center justify-center p-6 antialiased selection:bg-teal-100 selection:text-teal-900">

  <!-- Centered Card Container (Identical size and styling) -->
  <div class="w-full max-w-[440px] bg-white border border-stone-200/90 rounded-2xl shadow-sm shadow-stone-200/50 p-8 sm:p-10 transition-all">
    
    <!-- Branding Header -->
    <div class="flex flex-col items-center text-center mb-6">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 rounded-xl bg-teal-800 text-white flex items-center justify-center font-brand font-semibold text-2xl shadow-inner shadow-teal-950/20">
          O
        </div>
        <div class="text-left">
          <span class="font-brand text-2xl font-bold tracking-tight text-stone-900 block leading-none">Ownly</span>
          <span class="text-[11px] font-medium tracking-wider uppercase text-stone-500 block mt-0.5">Retail Manager</span>
        </div>
      </div>
      
      <!-- Icon Pill -->
      <div class="w-12 h-12 rounded-full bg-teal-50 border border-teal-100 text-teal-800 flex items-center justify-center mt-3 mb-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>

      <h1 class="font-brand text-2xl sm:text-[26px] font-semibold text-stone-900 mt-2 tracking-tight">Verify your email</h1>
      <p class="text-xs sm:text-sm text-stone-500 mt-1 max-w-[320px] mx-auto leading-relaxed">
        We sent a 6-digit confirmation code to <span class="font-semibold text-stone-800">bhaskarwarparth@gmail.com</span>
      </p>
    </div>

    <!-- Verification Form -->
    <form class="space-y-6" onsubmit="event.preventDefault();">
      
      <!-- 6-Box Code Input -->
      <div>
        <label class="block text-center text-xs font-semibold uppercase tracking-wider text-stone-600 mb-3">Verification Code</label>
        <div class="grid grid-cols-6 gap-2 sm:gap-2.5">
          <input 
            type="text" 
            maxlength="1" 
            value="4" 
            class="w-full h-12 sm:h-13 text-center text-lg sm:text-xl font-bold text-stone-900 bg-stone-50/50 border border-teal-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 focus:bg-white transition-all font-mono"
            autofocus
          >
          <input 
            type="text" 
            maxlength="1" 
            value="8" 
            class="w-full h-12 sm:h-13 text-center text-lg sm:text-xl font-bold text-stone-900 bg-stone-50/50 border border-teal-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 focus:bg-white transition-all font-mono"
          >
          <input 
            type="text" 
            maxlength="1" 
            value="2" 
            class="w-full h-12 sm:h-13 text-center text-lg sm:text-xl font-bold text-stone-900 bg-stone-50/50 border border-teal-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 focus:bg-white transition-all font-mono"
          >
          <input 
            type="text" 
            maxlength="1" 
            value="9" 
            class="w-full h-12 sm:h-13 text-center text-lg sm:text-xl font-bold text-stone-900 bg-stone-50/50 border border-teal-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 focus:bg-white transition-all font-mono"
          >
          <input 
            type="text" 
            maxlength="1" 
            value="0" 
            class="w-full h-12 sm:h-13 text-center text-lg sm:text-xl font-bold text-stone-900 bg-stone-50/50 border border-teal-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 focus:bg-white transition-all font-mono"
          >
          <input 
            type="text" 
            maxlength="1" 
            value="6" 
            class="w-full h-12 sm:h-13 text-center text-lg sm:text-xl font-bold text-stone-900 bg-stone-50/50 border border-teal-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-700/20 focus:border-teal-700 focus:bg-white transition-all font-mono"
          >
        </div>
      </div>

      <!-- Submit Action -->
      <div>
        <button 
          type="submit" 
          class="w-full py-2.5 px-4 bg-teal-800 hover:bg-teal-900 text-white font-medium text-sm rounded-xl shadow-sm shadow-teal-950/20 hover:shadow-md transition-all duration-150 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-teal-700 focus:ring-offset-2"
        >
          <span>Verify & Continue</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
        </button>
      </div>

      <!-- Resend Code with Countdown Timer -->
      <div class="text-center pt-1">
        <p class="text-xs sm:text-sm text-stone-500">
          Didn't receive the email?
        </p>
        <div class="mt-2 flex items-center justify-center gap-2">
          <button 
            type="button" 
            class="text-xs sm:text-sm font-semibold text-stone-400 cursor-not-allowed hover:text-stone-400 flex items-center gap-1.5"
            disabled
          >
            <svg class="w-3.5 h-3.5 text-stone-400 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            <span>Resend code</span>
          </button>
          <span class="text-xs font-mono text-stone-400 bg-stone-100 px-2 py-0.5 rounded-full border border-stone-200">
            00:48
          </span>
        </div>
      </div>

    </form>

    <!-- Footer Links / Back to Login -->
    <div class="mt-8 pt-6 border-t border-stone-100 text-center">
      <a href="#" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-medium text-stone-500 hover:text-stone-800 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        <span>Back to sign in</span>
      </a>
    </div>

  </div>

  <!-- Micro Footer / Security Badge -->
  <div class="mt-8 flex items-center gap-2 text-stone-400 text-xs">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
    </svg>
    <span>Two-factor authentication protection</span>
  </div>

</body>
</html>
